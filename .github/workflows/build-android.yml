name: Build Android Project

on:
  workflow_dispatch:
  push:
    branches:
      - android-kotlin-project

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug -x lint --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4096m -XX:+UseG1GC"

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: List build outputs
        if: always()
        run: |
          echo "=== Build Output ==="
          find app/build/outputs -type f -name "*.apk" 2>/dev/null || echo "No APK files found"
          echo "=== Gradle build folder ==="
          ls -la app/build/ || echo "Build folder not found"
